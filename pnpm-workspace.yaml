# SECURITY: Keep the one-day release delay to reduce supply-chain risk.
# Do not disable minimumReleaseAge.
packages:
  - artifacts/*

allowBuilds:
  esbuild: true
autoInstallPeers: false

catalog:
  '@tailwindcss/vite': ^4.3.5
  '@types/node': ^25.9.9
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^5.2.0
  clsx: ^2.1.1
  framer-motion: ^12.43.0
  lucide-react: ^0.577.0
  react: 19.3.1
  react-dom: 19.3.1
  tailwind-merge: ^3.7.1
  tailwindcss: ^4.3.5
  vite: ^7.3.8
  wouter: ^3.13.0

minimumReleaseAge: 1440

overrides:
  # Latest typography still pins the vulnerable 6.x parser.
  '@tailwindcss/typography>postcss-selector-parser': ^7.1.6
  # Latest Tailwind node package still resolves the vulnerable source-map release.
  '@tailwindcss/node>source-map-js': ^1.2.2
  esbuild: 0.28.1

