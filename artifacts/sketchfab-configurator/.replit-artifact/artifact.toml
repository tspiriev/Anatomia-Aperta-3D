kind = "web"
previewPath = "/"
title = "Anatomia Aperta 3D"
version = "1.0.0"
id = "artifacts/sketchfab-configurator"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18169

[services.development]
run = "pnpm --filter @workspace/sketchfab-configurator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sketchfab-configurator", "run", "build" ]
serve = "static"
publicDir = "artifacts/sketchfab-configurator/dist/public"

# Route-specific HTML serves metadata and readable content without JavaScript.
# No catch-all: the static host serves 404.html with HTTP 404 for unknown URLs.
[[services.production.rewrites]]
from = "/atlas"
to = "/atlas/index.html"
